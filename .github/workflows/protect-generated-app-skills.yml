name: Protect generated app-skills

on:
  pull_request:

permissions:
  contents: read
  pull-requests: read

jobs:
  guard:
    name: Protect generated app-skills
    runs-on: ubuntu-latest
    steps:
      - name: Reject direct app-skills changes
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail

          changes_app_skills=false
          while IFS= read -r file; do
            case "$file" in
              app-skills/*)
                changes_app_skills=true
                break
                ;;
            esac
          done < <(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/files" --paginate --jq '.[].filename')

          if [[ "$changes_app_skills" != true ]]; then
            echo "This PR does not change app-skills/."
            exit 0
          fi

          if [[ "$PR_AUTHOR" == "oomol-bot" && "$HEAD_REPO" == "oomol-lab/skills" && "$HEAD_REF" == "bot/sync-app-skills" ]]; then
            echo "Authorized connector synchronization PR."
            exit 0
          fi

          echo "::error::app-skills/ is generated by oomol/oomol-connector and cannot be edited directly. Move the change to scripts/skills/overlays/<service>/ in that repository, then run Publish App Skills."
          exit 1
